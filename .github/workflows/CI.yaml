name: Project Bare Metal Native Vulkan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: [self-hosted, windows, x64]

    steps:
    - name: 1. Checkout core code & Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive 

    - name: 2. Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: 3. Configure CMake architecture tree
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: 4. Incremental Compilation
      run: |
        cmake --build build --config Debug --verbose

    - name: 5. GPU Compute Pipeline Execution (Physical Ignition)
      shell: cmd
      env:
        VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
      run: |
        echo "=== RUNNING TEST ==="
        .\build\Debug\BareMetalComputeProbe.exe 
