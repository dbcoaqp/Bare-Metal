name: Project Bare Metal Native Vulkan CI

# Trigger: Executes every time a push is made to the main branch or a pull request is initiated.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Forces the program to run on your physical Windows machine, instead of GitHub's cloud server.
    runs-on: [self-hosted, windows, x64]

    steps:
    - name: 1. Checkout core code
      uses: actions/checkout@v4
      
    - name: 2. Set Execution Policy
      shell: cmd
      run: |
        "C:\Program Files\Microsoft Visual Studio\18\Community\Common7\Tools\VsDevCmd.bat" -arch=amd64 && powershell -NoExit
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build --config Debug
        powershell Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
        .\build\x64-Debug\BareMetalComputeProbe.e


